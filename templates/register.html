<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account · Small Store Inventory</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="auth-container">
        <section class="card auth-card">
            <p class="eyebrow">Store inventory</p>
            <h1>Create an account</h1>
            <p class="auth-description">Your inventory is kept separate from other accounts.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('create_account') }}" method="post" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label>
                    Username
                    <input name="username" type="text" required minlength="3" maxlength="32"
                           pattern="[A-Za-z0-9_]+" autocomplete="username" autofocus>
                    <small>3–32 letters, numbers, or underscores.</small>
                </label>
                <label>
                    Password
                    <input name="password" type="password" required minlength="8"
                           autocomplete="new-password">
                    <small>Use at least 8 characters.</small>
                </label>
                <button type="submit">Create account</button>
            </form>
            <p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
        </section>
    </main>
</body>
</html>
